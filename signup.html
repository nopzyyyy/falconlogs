<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next) {
      const nextInput = document.getElementById('paramSignupNext');
      if (nextInput) nextInput.value = next;
      const form = document.querySelector('form');
      if (form) form.action = '/auth/signup?next=' + encodeURIComponent(next);
      const loginLink = document.querySelector('a[href="/auth/login"]');
      if (loginLink) loginLink.href = '/auth/login?next=' + encodeURIComponent(next);
    }
  })();
</script>
