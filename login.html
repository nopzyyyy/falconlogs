<!doctype html>
<html lang="en" class="loader-active">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Login - Falcon Logs</title>
    <style>
      html.loader-active,
      body.loader-active {
        overflow: hidden !important;
        overscroll-behavior: none;
        height: 100%;
        touch-action: none;
      }
      body.loader-active #pageLoader ~ * {
        visibility: hidden;
      }
      #pageLoader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        z-index: 2147483646;
        background: #141414;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
    </style>
    <link rel="icon" type="image/png" href="/logo.png?v=1003">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1003">
    <link rel="shortcut icon" href="/favicon.ico?v=1003">
    <link rel="apple-touch-icon" href="/logo.png?v=1003">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="/custom.css?v=mu3gcn01">
  </head>
  <body class="bg-dark2 loader-active" style="background-color: #141414; color: #fff;">
    <!-- FULL-PAGE AUTHED LOADING OVERLAY -->
    <div id="pageLoader">
      <div class="loader-card">
        <img src="/logo.png?v=1003" alt="Falcon Logs" class="loader-logo">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading assets please be patient</div>
      </div>
    </div>

    <div class="container-md">
      <!-- HEADER / NAVBAR (AUTHED 1:1 STYLE) -->
      <nav class="navbar navbar-expand-lg navbar-dark rounded-2 p-2">
        <a class="navbar-brand" href="/">
          <img src="/logo.png?v=1003" alt="Falcon Logs" style="height: 44px; margin-top: 2px;">
        </a>
        <button class="navbar-toggler" data-bs-target="#headerCollapse" data-bs-toggle="collapse" type="button" aria-label="Menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="headerCollapse">
          <!-- Main navigation: ONLY Home on guest state exactly as authed.cc -->
          <ul class="navbar-nav align-items-center">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          </ul>

          <!-- Guest Actions: LOGIN or CREATE ACCOUNT -->
          <ul class="navbar-nav ms-auto navbar-auth-actions" id="navGuestActions">
            <li class="nav-item">
              <a class="nav-link btn btn-primary" href="javascript:void(0)" id="navLoginTab">login</a>
            </li>
            <li class="nav-item navbar-auth-or-wrap"><span class="navbar-auth-or text-white">or</span></li>
            <li class="nav-item">
              <a class="nav-link btn btn-gradient" href="javascript:void(0)" id="navSignupTab">create account</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- AUTH CONTENT CONTAINER -->
      <div class="loadable-content loaded">
        <div class="main-content auth">
          <!-- ERROR / ALERT MESSAGE -->
          <div id="authAlert" class="alert alert-danger mb-3" style="display: none; border-radius: 6px; font-size: 13px; padding: 10px 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;"></div>

          <!-- 1. LOGIN FORM (DEFAULT) -->
          <form id="loginForm" autocomplete="on">
            <h5 class="text-center mb-3">Login</h5>

            <label for="loginEmail">Email</label>
            <input class="form-control mb-3" id="loginEmail" name="email" placeholder="email@service.com" required type="text" autocomplete="email">

            <label for="loginPassword">Password</label>
            <input class="form-control mb-3" id="loginPassword" name="password" placeholder="password" required type="password" autocomplete="current-password">

            <button class="btn btn-success mb-3 w-100" id="btnLoginSubmit" type="submit">Login</button>

            <p class="m-auto text-center text-white">
              Don't have an account? <a href="javascript:void(0)" id="switchSignupLink">create one</a> now
            </p>
            <p class="m-auto text-center text-white">
              Forgot password? <a href="/support.html">reset</a>
            </p>
          </form>

          <!-- 2. SIGNUP FORM (AUTHED 1:1 WITH USERNAME) -->
          <form id="signupForm" style="display: none;" autocomplete="on">
            <h5 class="text-center mb-3">Signup</h5>

            <label for="signupEmail">Email</label>
            <input class="form-control mb-3" id="signupEmail" name="email" placeholder="email@service.com" required type="email" autocomplete="email">

            <label for="signupUsername">Username</label>
            <input class="form-control mb-3" id="signupUsername" name="username" placeholder="username" required type="text" autocomplete="username">

            <label for="signupPassword">Password</label>
            <input class="form-control mb-3" id="signupPassword" name="password" placeholder="password" required type="password" autocomplete="new-password">

            <label for="signupConfirmPassword">Confirm Password</label>
            <input class="form-control mb-3" id="signupConfirmPassword" name="confirmPassword" placeholder="repeat password" required type="password" autocomplete="new-password">

            <button class="btn btn-success mb-3 w-100" id="btnSignupSubmit" type="submit">Signup</button>

            <p class="m-auto text-center text-white">
              Already have an account? <a href="javascript:void(0)" id="switchLoginLink">login</a>
            </p>
          </form>
        </div>
      </div>

      <!-- FOOTER (AUTHED 1:1) -->
      <footer class="bg-dark text-white p-4 mb-3 d-flex justify-content-center align-items-center flex-column" style="margin-top:0">
        <nav class="navbar navbar-expand navbar-dark bg-transparent p-2 mb-0 mt-0">
          <ul class="navbar-nav flex-wrap d-flex justify-content-center align-items-center">
            <li class="nav-item d-flex flex-row align-items-center me-lg-2 text-success">
              <a class="nav-link me-lg-0 me-1" href="/vouches.html">REVIEWS</a>
              <svg class="footer-tg-icon" fill="none" height="15" viewBox="0 0 15 15" width="15" xmlns="http://www.w3.org/2000/svg">
                <circle cx="7.5" cy="7.5" fill="currentColor" r="7.5"></circle>
                <path clip-rule="evenodd" d="M9.81536 10.2821L9.81561 10.2815L9.82182 10.266L10.8928 4.86629V4.84875C10.8928 4.71421 10.8431 4.59676 10.7349 4.52631C10.6403 4.46465 10.5314 4.46026 10.4551 4.46605C10.3744 4.47218 10.2983 4.49233 10.2456 4.5091C10.2185 4.51773 10.1958 4.52604 10.1795 4.53233C10.1714 4.53548 10.1648 4.53816 10.16 4.54016L10.1553 4.54214L4.18392 6.88462L4.18227 6.88521C4.17905 6.88638 4.17478 6.88797 4.16963 6.88998C4.15936 6.89398 4.14538 6.8997 4.12896 6.90714C4.09672 6.92175 4.05217 6.9443 4.00699 6.97524C3.93026 7.02779 3.78414 7.15219 3.80882 7.34941C3.82925 7.51277 3.94186 7.61652 4.01778 7.67024C4.05847 7.69903 4.09741 7.7198 4.12592 7.73337C4.14036 7.74025 4.15263 7.74552 4.16177 7.74924C4.16635 7.7511 4.17018 7.75259 4.17315 7.75372L4.17694 7.75513L4.17937 7.75604L5.2241 8.10775C5.22057 8.1733 5.22707 8.24013 5.24446 8.30607L5.76777 10.2912C5.82982 10.5266 6.04276 10.6906 6.28618 10.6904C6.50437 10.6902 6.69788 10.5582 6.78009 10.3613L7.59711 9.48769L9.00032 10.5635L9.02027 10.5722C9.14776 10.6278 9.26687 10.6455 9.37577 10.6306C9.48452 10.6157 9.57094 10.5701 9.63585 10.5182C9.69973 10.4671 9.74351 10.4094 9.77104 10.366C9.78503 10.3439 9.79546 10.3245 9.80269 10.3099C9.80632 10.3026 9.80919 10.2964 9.81133 10.2916L9.81402 10.2853L9.81498 10.283L9.81536 10.2821ZM5.76246 8.16951C5.75056 8.12439 5.76923 8.07677 5.80862 8.05175L9.3522 5.80143C9.3522 5.80143 9.56062 5.67489 9.55317 5.80143C9.55317 5.80143 9.59037 5.82377 9.47869 5.92796C9.37275 6.02692 6.95309 8.36301 6.70825 8.5994C6.69412 8.61304 6.68568 8.6287 6.6807 8.6477L6.28577 10.1547L5.76246 8.16951Z" fill="white" fill-rule="evenodd"></path>
              </svg>
            </li>
            <li class="nav-item"><a class="nav-link" href="/tos.html">TOS</a></li>
            <li class="nav-item"><a class="nav-link" href="/faq.html">FAQS</a></li>
          </ul>
        </nav>
        <p class="m-auto text-center mt-2 text-white">© 2026 Falcon Logs All rights reserved</p>
      </footer>
    </div>

    <script src="/bootstrap.bundle.min.js"></script>
    <script>
      // Hide initial loading overlay once page resources are ready
      function hidePageLoader() {
        const el = document.getElementById('pageLoader');
        if (el) el.classList.add('hidden');
        document.documentElement.classList.remove('loader-active');
        document.body.classList.remove('loader-active');
      }
      if (document.readyState === 'complete') {
        hidePageLoader();
      } else {
        window.addEventListener('load', hidePageLoader);
        setTimeout(hidePageLoader, 4000);
      }

      const urlParams = new URLSearchParams(window.location.search);
      let redirectTarget = urlParams.get('redirect') || '/';
      if (redirectTarget === '/login' || redirectTarget === '/login.html') redirectTarget = '/';

      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const authAlert = document.getElementById('authAlert');
      const navLoginTab = document.getElementById('navLoginTab');
      const navSignupTab = document.getElementById('navSignupTab');
      const switchSignupLink = document.getElementById('switchSignupLink');
      const switchLoginLink = document.getElementById('switchLoginLink');

      function showAlert(msg) {
        if (!authAlert) return;
        authAlert.textContent = msg;
        authAlert.style.display = 'block';
      }

      function hideAlert() {
        if (!authAlert) return;
        authAlert.textContent = '';
        authAlert.style.display = 'none';
      }

      function showLoginMode() {
        hideAlert();
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        document.title = 'Login - Falcon Logs';
        if (navLoginTab) {
          navLoginTab.className = 'nav-link btn btn-primary active';
        }
        if (navSignupTab) {
          navSignupTab.className = 'nav-link btn btn-gradient';
        }
        const emailEl = document.getElementById('loginEmail');
        if (emailEl) emailEl.focus();
      }

      function showSignupMode() {
        hideAlert();
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        document.title = 'Signup - Falcon Logs';
        if (navLoginTab) {
          navLoginTab.className = 'nav-link btn btn-gradient';
        }
        if (navSignupTab) {
          navSignupTab.className = 'nav-link btn btn-primary active';
        }
        const emailEl = document.getElementById('signupEmail');
        if (emailEl) emailEl.focus();
      }

      // Check initial URL query mode
      const initialMode = urlParams.get('mode') || '';
      if (initialMode === 'signup' || initialMode === 'register' || urlParams.has('signup') || urlParams.has('register')) {
        showSignupMode();
      } else {
        showLoginMode();
      }

      // Switch triggers
      switchSignupLink?.addEventListener('click', showSignupMode);
      navSignupTab?.addEventListener('click', showSignupMode);

      switchLoginLink?.addEventListener('click', showLoginMode);
      navLoginTab?.addEventListener('click', showLoginMode);

      // Handle Login Form Submission
      loginForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const submitBtn = document.getElementById('btnLoginSubmit');

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 15px; height: 15px; border-width: 2px;"></span>Logging in...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (res.ok) {
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 15px; height: 15px; border-width: 2px;"></span>Success! Redirecting...';
            let target = redirectTarget;
            if (data.role === 'ADMIN' || data.role === 'GOD') {
              target = (target && !['/logs', '/', '/index.html', '/login'].includes(target)) ? target : '/admin.html';
            }
            window.location.href = target;
          } else {
            showAlert(data.error || 'Invalid email or password.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
          }
        } catch (_) {
          showAlert('Network error. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      });

      // Handle Signup Form Submission
      signupForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('signupEmail').value.trim();
        const username = document.getElementById('signupUsername')?.value.trim() || '';
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;
        const submitBtn = document.getElementById('btnSignupSubmit');

        if (!email || !username || !password || !confirmPassword) {
          showAlert('Please fill in all fields.');
          return;
        }

        if (password.length < 10) {
          showAlert('Password must be at least 10 characters.');
          return;
        }

        if (password !== confirmPassword) {
          showAlert('Passwords do not match.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 15px; height: 15px; border-width: 2px;"></span>Signing up...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, password, confirmPassword })
          });
          const data = await res.json();

          if (res.ok) {
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 15px; height: 15px; border-width: 2px;"></span>Logging in...';
            // Auto login
            const loginRes = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            if (loginRes.ok) {
              submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true" style="width: 15px; height: 15px; border-width: 2px;"></span>Success! Redirecting...';
              window.location.href = redirectTarget;
            } else {
              showLoginMode();
              showAlert('Account created successfully! Please sign in.');
            }
          } else {
            showAlert(data.error || 'Account registration failed.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Signup';
          }
        } catch (_) {
          showAlert('Network error. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Signup';
        }
      });
    </script>
  </body>
</html>
