<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/logo.png?v=1001">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1001">
    <link rel="shortcut icon" href="/favicon.ico?v=1001">
    <link rel="apple-touch-icon" href="/logo.png?v=1001">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Login - Falcon Logs</title>
    <link rel="icon" type="image/png" href="/logo.png?v=1001">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1001">
    <link rel="shortcut icon" href="/favicon.ico?v=1001">
    <link rel="apple-touch-icon" href="/logo.png?v=1001">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/styles.css?v=1007">
    <style>
      :root {
        color-scheme: dark;
        --bg: #141414;
        --store-input-bg: #110e0a;
        --store-input-hover: #15110d;
        --line: rgba(234, 88, 12, 0.22);
        --accent: #ea580c;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100% !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        width: 100% !important;
        overflow: hidden !important;
        position: fixed !important;
        inset: 0 !important;
        overscroll-behavior: none !important;
        touch-action: none !important;
        -webkit-overflow-scrolling: none !important;
        background-color: #141414 !important;
      }

      body {
        background: #141414 !important;
        background-color: #141414 !important;
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        margin: 0;
      }

      .form-input {
        touch-action: manipulation;
      }

      .login-particles {
        display: none !important;
      }

      .standalone-login-wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .login-brand-link {
        display: flex;
        justify-content: center;
        margin-top: 14px;
        margin-bottom: 14px;
        text-decoration: none;
      }

      .login-brand-logo {
        width: 155px;
        height: auto;
        display: block;
        filter: none;
        transition: transform 0.2s ease;
      }

      .login-brand-logo:hover {
        transform: scale(1.02);
      }

      .login-title {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        text-align: center;
        margin-bottom: 18px;
        letter-spacing: -0.2px;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .form-label {
        font-size: 11.5px;
        font-weight: 600;
        color: #888888;
        margin-bottom: 5px;
        letter-spacing: 0.2px;
      }

      .form-input-wrap {
        position: relative;
        width: 100%;
      }

      .form-input {
        width: 100%;
        height: 40px;
        background: #110e0a;
        border: 1px solid rgba(234, 88, 12, 0.22);
        border-radius: 4px;
        padding: 0 12px;
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 500;
        outline: none;
        transition: border-color 0.15s ease, background 0.15s ease;
      }

      .form-input::placeholder {
        color: rgba(255, 255, 255, 0.38);
        font-size: 12.5px;
      }

      .form-input:focus {
        border-color: #ea580c;
        background: #15110d;
      }

      .form-input-wrap .toggle-pass-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #777777;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
      }

      .form-input-wrap .toggle-pass-btn:hover {
        color: #ea580c;
      }

      .login-btn {
        width: 100%;
        height: 40px;
        background: #ea580c;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-family: 'Montserrat', sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-btn:hover {
        background: #c2410c;
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .login-toggle-row {
        margin-top: 14px;
        font-size: 11.5px;
        color: #777777;
        text-align: center;
      }

      .login-toggle-btn {
        background: transparent;
        border: none;
        color: #ea580c;
        font-family: 'Montserrat', sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }

      .login-toggle-btn:hover {
        color: #f97316;
      }

      .login-back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #555555;
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .login-back-link:hover {
        color: #aaaaaa;
      }

      .login-alert-msg {
        background: rgba(220, 38, 38, 0.12);
        border: 1px solid rgba(220, 38, 38, 0.4);
        color: #f87171;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 11.5px;
        font-weight: 600;
        margin-bottom: 12px;
        display: none;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <canvas id="particlesCanvas" class="login-particles"></canvas>
    <div class="standalone-login-wrap">
      <!-- LOGO -->
      <a href="/" class="login-brand-link" aria-label="Falcon Logs Home">
        <img src="/login-logo.png" alt="Falcon Logs" class="login-brand-logo">
      </a>

      <!-- TITLE -->
      <h1 class="login-title" id="authTitle">Login</h1>

      <!-- ERROR ALERT -->
      <div class="login-alert-msg" id="authErrorMsg"></div>

      <!-- FORM -->
      <form class="login-form" id="authForm" autocomplete="on">
        <!-- Optional Name on Register -->
        <div class="form-field" id="authNameField" style="display: none;">
          <label class="form-label" for="authName">Name</label>
          <input type="text" id="authName" class="form-input" placeholder="Your name (optional)" autocomplete="name">
        </div>

        <!-- Email -->
        <div class="form-field">
          <label class="form-label" for="authEmail">Email</label>
          <input type="email" id="authEmail" class="form-input" placeholder="email@service.com" required autocomplete="email">
        </div>

        <!-- Password -->
        <div class="form-field">
          <label class="form-label" for="authPassword">Password</label>
          <div class="form-input-wrap">
            <input type="password" id="authPassword" class="form-input" placeholder="password" required autocomplete="current-password">
            <button type="button" class="toggle-pass-btn" id="togglePassBtn" aria-label="Toggle password">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password on Register -->
        <div class="form-field" id="authConfirmPassField" style="display: none;">
          <label class="form-label" for="authConfirmPassword">Confirm Password</label>
          <div class="form-input-wrap">
            <input type="password" id="authConfirmPassword" class="form-input" placeholder="repeat password" autocomplete="new-password">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="login-btn" id="authSubmitBtn">Login</button>
      </form>

      <!-- Toggle Mode -->
      <div class="login-toggle-row">
        <span id="authToggleText">New here?</span>
        <button type="button" class="login-toggle-btn" id="toggleAuthBtn">Create an account</button>
      </div>
    </div>

    <script>
      let isRegister = false;
      const form = document.querySelector('#authForm');
      const emailInput = document.querySelector('#authEmail');
      const passInput = document.querySelector('#authPassword');
      const nameField = document.querySelector('#authNameField');
      const nameInput = document.querySelector('#authName');
      const confirmPassField = document.querySelector('#authConfirmPassField');
      const confirmPassInput = document.querySelector('#authConfirmPassword');
      const submitBtn = document.querySelector('#authSubmitBtn');
      const title = document.querySelector('#authTitle');
      const toggleText = document.querySelector('#authToggleText');
      const toggleBtn = document.querySelector('#toggleAuthBtn');
      const errorMsg = document.querySelector('#authErrorMsg');

      function setAuthMode(register) {
        isRegister = register;
        if (isRegister) {
          title.textContent = "Register";
          submitBtn.textContent = "Register";
          nameField.style.display = 'flex';
          confirmPassField.style.display = 'flex';
          confirmPassInput.required = true;
          passInput.autocomplete = 'new-password';
          toggleText.textContent = "Already have an account?";
          toggleBtn.textContent = "Log in";
        } else {
          title.textContent = "Login";
          submitBtn.textContent = "Login";
          nameField.style.display = 'none';
          confirmPassField.style.display = 'none';
          confirmPassInput.required = false;
          passInput.autocomplete = 'current-password';
          toggleText.textContent = "New here?";
          toggleBtn.textContent = "Create an account";
        }
        errorMsg.style.display = 'none';
      }

      // Check URL parameters for mode=register
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'register' || urlParams.has('register')) {
        setAuthMode(true);
      }


      toggleBtn.addEventListener('click', () => {
        setAuthMode(!isRegister);
      });

      // Toggle password visibility
      const togglePassBtn = document.querySelector('#togglePassBtn');
      if (togglePassBtn) {
        togglePassBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          togglePassBtn.style.color = isPass ? '#ea580c' : '#777777';
        });
      }


      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value;
        const name = nameInput.value.trim();
        const confirmPassword = confirmPassInput.value;


        if (isRegister) {
          if (password.length < 6) {
            errorMsg.textContent = "Password must be at least 6 characters.";
            errorMsg.style.display = 'block';
            return;
          }
          if (password !== confirmPassword) {
            errorMsg.textContent = "Passwords do not match.";
            errorMsg.style.display = 'block';
            return;
          }
        }


        submitBtn.disabled = true;
        submitBtn.textContent = isRegister ? "Registering..." : "Logging in...";

        const endpoint = isRegister ? "/api/auth/register" : "/api/auth/login";
        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name || undefined,
              email: email,
              password: password,
              confirmPassword: isRegister ? confirmPassword : undefined
            })
          });
          const data = await res.json();
          if (res.ok) {
            if (isRegister) {
              const loginRes = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
              });
              const loginData = await loginRes.json();
              if (loginRes.ok) {
                let target = urlParams.get('redirect');
                if (loginData.role === "ADMIN" || loginData.role === "GOD") {
                  target = (target && !['/logs', '/', '/index.html'].includes(target)) ? target : '/admin.html';
                } else {
                  target = target || "/logs";
                }
                window.location.href = target;
              } else {
                setAuthMode(false);
                errorMsg.textContent = "Registered! Please sign in.";
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "Login";
              }
            } else {
              let target = urlParams.get('redirect');
              if (data.role === "ADMIN" || data.role === "GOD") {
                target = (target && !['/logs', '/', '/index.html'].includes(target)) ? target : '/admin.html';
              } else {
                target = target || "/logs";
              }
              window.location.href = target;
            }
          } else {
            errorMsg.textContent = data.error || (isRegister ? "Registration failed." : "Invalid email or password.");
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = isRegister ? "Register" : "Login";
          }
        } catch (err) {
          errorMsg.textContent = "Connection error. Please try again.";
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = isRegister ? "Register" : "Login";
        }
      });

      // Prevent mobile drag / bounce scrolling on login
      document.addEventListener('touchmove', function(e) {
        if (!e.target.closest('input, textarea')) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
    <script src="/cart-utils.js?v=1008" defer></script>
  </body>
</html>
