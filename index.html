<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/logo.png?v=1001">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1001">
    <link rel="shortcut icon" href="/favicon.ico?v=1001">
    <link rel="apple-touch-icon" href="/logo.png?v=1001">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Store - Falcon Logs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css?v=1001">
  </head>
  <body>
    <!-- HEADER (ENCLOSED CARD) -->
    <div class="site-header-wrap">
      <header class="store-site-header">
        <a class="brand" href="/" aria-label="Falcon Logs">
          <img src="/logo.png" alt="Falcon Logs Logo" class="brand-logo-img">
          <span class="brand-text">
            <span class="brand-name-top">Falcon</span>
            <span class="brand-name-bottom">Logs</span>
          </span>
        </a>
        <nav class="header-nav-center" aria-label="Primary">
          <a href="/" class="header-nav-link active">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
            <span>Logs</span>
          </a>
          <a href="/orders.html" class="header-nav-link ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
            <span>Orders</span>
          </a>
          <a href="/support.html" class="header-nav-link ">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
            <span>Support</span>
          </a>
        </nav>
        <div class="nav-actions">
          <a class="cart-icon-btn" href="/cart.html" aria-label="Cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
            <span class="cart-badge" data-cart-count>0</span>
          </a>
          <div class="nav-account-dropdown-wrap">
            <a class="nav-btn" href="/login.html" id="navUserBtn">
              <svg class="nav-btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span id="navUserText">Log in</span>
            </a>
          </div>
        </div>
      </header>
    </div>

    <!-- STORE SHELL -->
    <main class="store-shell">
      <!-- STORE HERO SECTION -->
      <section class="store-hero-section">
        <div class="store-hero-logo-wrap">
          <canvas id="falconFireCanvasUnder" class="hero-fire-canvas hero-fire-canvas-under"></canvas>
          <img src="/hero-logo.png" alt="Falcon Logs Logo" class="store-hero-logo">
          <canvas id="falconFireCanvasOver" class="hero-fire-canvas hero-fire-canvas-over"></canvas>
        </div>
        <h1 class="store-hero-title">Welcome to <span class="hero-orange-text">Falcon Logs</span></h1>
      </section>

      <!-- SEARCH & CATEGORY CONTROLS -->
      <div class="store-controls-wrap">
        <div class="search-input-wrapper">
          <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="productSearch" type="search" class="store-search-input" placeholder="Search for a Product" autocomplete="off">
        </div>

        <div class="category-dropdown-wrapper">
          <button type="button" class="category-dropdown-btn" id="categoryDropdownToggle" aria-haspopup="true" aria-expanded="false">
            <div class="category-dropdown-left">
              <svg class="category-dropdown-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
              <span id="selectedCategoryLabel">Choose Category</span>
            </div>
            <svg class="category-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="category-menu-panel" id="categoryMenuPanel" style="display: none;">
            <div class="category-search-box">
              <svg class="category-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
              <input type="text" id="categorySearchInput" class="category-search-input" placeholder="Search..." autocomplete="off">
            </div>
            <div class="category-items-list" id="categoryItemsList"></div>
          </div>
        </div>
      </div>

      <!-- PRODUCTS COUNT -->
      <h4 class="product-count-heading">Total found: <span id="productCountNum">0</span></h4>

      <!-- PRODUCTS GRID -->
      <div id="productGrid" class="product-grid"></div>
    </main>

    <!-- PURCHASE MODAL (MATCHING REFERENCE SCREENSHOT) -->
    <div class="modal-overlay" id="purchaseModalOverlay">
      <div class="modal-card">
        <div class="modal-header-row">
          <h2 class="modal-title" id="purchaseModalTitle">PRODUCT NAME</h2>
          <button type="button" class="modal-close-square-btn" id="closePurchaseModal" aria-label="Close">&times;</button>
        </div>
        
        <!-- DESCRIPTION SECTION -->
        <div class="modal-section-label">DESCRIPTION</div>
        <div class="modal-desc-box" id="purchaseModalDesc"></div>

        <!-- TAGS SECTION -->
        <div class="modal-section-label" id="purchaseModalTagsLabel">TAGS</div>
        <div class="modal-tags-row" id="purchaseModalTags"></div>

        <!-- VARIANT SELECT SECTION -->
        <div class="modal-form-group">
          <label class="modal-section-label" for="purchaseModalVariantSelect">SELECT VARIANT</label>
          <div class="modal-select-wrap">
            <select id="purchaseModalVariantSelect" class="modal-select"></select>
            <svg class="modal-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div id="purchaseModalCustomInputs" style="display:none; flex-direction:column; gap:12px; margin-bottom: 14px;"></div>

        <!-- SEPARATOR -->
        <div class="modal-divider"></div>

        <!-- QUANTITY & TOTAL ROW -->
        <div class="modal-qty-total-row">
          <div class="modal-qty-col">
            <div class="modal-section-label">QUANTITY</div>
            <div class="quantity-stepper-box">
              <button type="button" class="stepper-btn" id="purchaseQtyMinus">-</button>
              <span class="stepper-val" id="purchaseQtyVal">1</span>
              <button type="button" class="stepper-btn" id="purchaseQtyPlus">+</button>
            </div>
          </div>
          <div class="modal-total-col">
            <div class="modal-section-label">TOTAL</div>
            <div class="modal-total-val" id="purchaseModalTotal">£0.00</div>
          </div>
        </div>

        <!-- ACTION BUTTONS ROW -->
        <div class="modal-actions-row">
          <button type="button" id="purchaseAddToCartBtn" class="modal-add-cart-primary-btn">Add to Cart</button>
          <a href="/cart.html" class="modal-view-cart-secondary-btn" id="purchaseViewCartBtn">View Cart</a>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="footer-nav-links">
        <a href="/">Home</a>
        <a href="/cart.html">Cart</a>
        <a href="/dashboard.html">Account</a>
        <a href="/orders.html">Orders</a>
      </div>
      <p class="footer-copyright">&copy; 2026 Falcon Logs. All rights reserved.</p>
      <div class="footer-dev">
        Developed by <a href="https://t.me/peoze" target="_blank" rel="noopener noreferrer"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0h-.056zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg> Mass</a>
      </div>
    </footer>

    <script src="cart-utils.js?v=1001" defer></script>
    <script src="logs.js?v=1001" defer></script>
  </body>
</html>
